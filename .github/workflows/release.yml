name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract changelog for this tag
        id: changelog
        run: |
          python - <<'PY' > /tmp/changelog_body.md
          import re, pathlib
          tag = "${{ github.ref_name }}".lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          # Extract the block for [tag]
          pattern = rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.S)
          print(m.group(1).strip() if m else f"Release {tag}")
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/changelog_body.md
          draft: false
          generate_release_notes: true
